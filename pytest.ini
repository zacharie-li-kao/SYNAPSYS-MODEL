[pytest]
testpaths = verification

# archive/, test_export/ and the "Save *" backups each contain their own copies
# of fitting.py, synapse_engine.py and data_converter.py. Collecting them makes
# pytest import whichever copy it reaches first, so a test can silently exercise
# a historical module instead of the canonical one at the project root.
# test_export/ is the worst case: its fitting.extract_synapse_model raises
# NotImplementedError by design.
norecursedirs = archive test_export Save* .git __pycache__ build dist

filterwarnings =
    ignore::DeprecationWarning
