name: Build Windows executable

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib customtkinter pyvisa pyvisa-py pillow openpyxl pandas pyinstaller pytest

      - name: Run verification suite
        run: python -m pytest verification/ -q

      - name: Build executable
        run: pyinstaller keithley_analyser.spec --noconfirm

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: keithley_analyser-exe
          path: dist/keithley_analyser.exe
          if-no-files-found: error
